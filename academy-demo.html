<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduPro – Academy Management Software (Demo)</title>
<style>
:root{--bg:#f1f5fb;--cd:#fff;--tx:#0f1b3d;--mu:#64708a;--bd:#e1e8f4;--pr:#1e3a8a;--ac:#2563eb;--lt:#dbeafe;--sb:#0b1f4d;--ok:#16a34a;--wn:#d97706;--er:#dc2626;--sh:0 4px 18px rgba(15,27,61,.07)}
[data-theme=dark]{--bg:#0a1226;--cd:#111c38;--tx:#e6ecfa;--mu:#8e9bbb;--bd:#1f2d52;--pr:#8ab4ff;--ac:#3b82f6;--lt:#1b2c57;--sb:#071029;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,Arial,sans-serif;display:flex;min-height:100vh}
.lucide{width:18px;height:18px}
#sb{position:fixed;inset:0 auto 0 0;width:248px;background:var(--sb);color:#cfd9f3;display:flex;flex-direction:column;z-index:30;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;padding:18px;font-size:19px;font-weight:700;color:#fff}
.brand img{width:32px;height:32px;border-radius:8px;object-fit:cover}.brand .lucide{width:28px;height:28px}
#nav{flex:1;overflow-y:auto;padding:6px 10px}
#nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:#b4c2e6;text-decoration:none;margin-bottom:2px}
#nav a:hover{background:#ffffff14;color:#fff}#nav a.on{background:var(--ac);color:#fff}
.demo{margin:12px;padding:8px;border:1px dashed #5b79c9;border-radius:8px;text-align:center;font-size:11px;letter-spacing:.08em;color:#9fb4ee}
.main{margin-left:248px;flex:1;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--cd);border-bottom:1px solid var(--bd);padding:12px 24px}
.top h2{margin:0;font-size:19px;flex:1}
.av{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.banner{background:var(--lt);color:var(--pr);font-size:12.5px;padding:7px 24px;border-bottom:1px solid var(--bd)}
#app{padding:22px 24px}
.ib{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:9px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer}
.ib.sm{width:30px;height:30px;margin-left:3px}.ib:hover{background:var(--lt)}.ib.dn:hover{background:#fee2e2;color:var(--er)}
#mb,#ov{display:none}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:var(--sh);margin-bottom:18px}
.ct{margin:0 0 14px;font-size:16px}.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.ch h3{margin:0;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:18px}
.sc{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh)}
.sc small{color:var(--mu);display:block}.sc b{font-size:20px}
.si{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--lt);color:var(--ac);flex:none}
.si.g{background:#dcfce7;color:var(--ok)}.si.o{background:#fef3c7;color:var(--wn)}.si.r{background:#fee2e2;color:var(--er)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cv{height:280px;position:relative}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);padding:10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--bd);white-space:nowrap}
tr:hover td{background:var(--bg)}.em{text-align:center;color:var(--mu);padding:28px}.ac{text-align:right}
.bg{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;display:inline-block}
.bg.ok{background:#dcfce7;color:#15803d}.bg.wn{background:#fef3c7;color:#b45309}.bg.er{background:#fee2e2;color:#b91c1c}.bg.in{background:var(--lt);color:var(--pr)}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--ac);color:#fff;border:0;border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn.g{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.dn{background:var(--er)}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.tb>.btn:last-child{margin-left:auto}
input,select,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;width:100%}
.tb input,.tb select{width:auto;min-width:170px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fg label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px}
.fg .w2{grid-column:1/-1}.fg textarea{min-height:64px}.fg input[readonly]{background:var(--bg)}
.fa{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.md{position:fixed;inset:0;background:#050b1c99;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.md.on{display:flex}
.mc{background:var(--cd);border-radius:16px;padding:22px;width:640px;max-width:100%;max-height:92vh;overflow:auto}.mc h3{margin:0 0 14px}
#ts{position:fixed;right:18px;top:18px;z-index:60;display:grid;gap:8px}
.t{background:var(--ok);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 6px 20px #0004;animation:in .25s}.t.er{background:var(--er)}
@keyframes in{from{transform:translateX(30px);opacity:0}}
.uc{display:flex;align-items:center;gap:10px}.uc small{display:block;color:var(--mu)}
.avs{width:36px;height:36px;border-radius:50%;background:var(--lt);color:var(--pr);display:grid;place-items:center;font-weight:700;font-size:13px;object-fit:cover;flex:none}
.avs.lg{width:72px;height:72px;font-size:24px}
.pf{display:flex;align-items:center;gap:14px;margin-bottom:14px}.pf h2,.pf h3{margin:0}.pf p,.pf small{margin:4px 0 0;color:var(--mu)}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.dg small{display:block;color:var(--mu)}.dg.s{grid-template-columns:1fr 1fr;margin-bottom:12px}
.fc{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}.fc .card{margin:0}
.cs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.sg{border:1px solid var(--bd);background:none;color:var(--tx);padding:5px 11px;border-radius:7px;cursor:pointer;font:inherit;font-size:12.5px;margin-right:4px}
.sg.on{color:#fff;border-color:transparent}.sg.Present{background:var(--ok)}.sg.Absent{background:var(--er)}.sg.Late{background:var(--wn)}.sg.Leave{background:var(--ac)}
.rc{color:#111;background:#fff;padding:14px;font-family:Arial,sans-serif;border-radius:8px}
.rh{display:flex;gap:12px;align-items:center;border-bottom:2px solid #1e3a8a;padding-bottom:10px}.rh img{height:46px}.rh h2{margin:0;color:#1e3a8a}.rh small{color:#555}
.rt{text-align:center;letter-spacing:.2em;color:#1e3a8a;margin:14px 0}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rg small{display:block;color:#666}
.rtb{width:100%;margin:14px 0}.rtb td{border-bottom:1px solid #ddd;color:#111}.rtb tr:hover td{background:none}.rtb tr:last-child td{font-weight:700;font-size:16px}.rtb td:last-child{text-align:right}
.sig{display:flex;justify-content:space-between;margin-top:46px}.sig span{border-top:1px solid #333;padding-top:4px;width:40%;text-align:center;font-size:12px}
.dm{text-align:center;color:#999;font-size:11px;margin:14px 0 0}
@media(max-width:900px){
#sb{transform:translateX(-100%)}body.so #sb{transform:none}body.so #ov{display:block;position:fixed;inset:0;background:#0007;z-index:25}
#mb{display:inline-grid}.main{margin-left:0}.g2,.fg{grid-template-columns:1fr}.top,#app{padding-left:14px;padding-right:14px}.banner{padding:7px 14px}}
@media print{
#sb,.top,.banner,.nop,#ov,#ts,.tb{display:none!important}.main{margin:0}body{background:#fff;display:block;color:#000}#app{padding:0}
.md:not(.on){display:none!important}
body.pr-r .main{display:none}body.pr-r .md{position:static;background:none;display:block;padding:0}
body.pr-r .mc{box-shadow:none;max-height:none;width:100%;max-width:none;padding:0;background:#fff}}

</style>
</head>
<body>
<aside id="sb">
  <div class="brand"><span id="bl"></span><span id="bn">EduPro</span></div>
  <nav id="nav"></nav>
  <div class="demo">FRONTEND DEMO · SAMPLE DATA</div>
</aside>
<div id="ov" onclick="document.body.classList.remove('so')"></div>
<div class="main">
  <header class="top">
    <button class="ib" id="mb" onclick="document.body.classList.toggle('so')"><i data-lucide="menu"></i></button>
    <h2 id="pt">Dashboard</h2>
    <button class="ib" id="th" title="Light / Dark mode"></button>
    <div class="av">AD</div>
  </header>
  <div class="banner">Demo version: all records shown are sample data stored in this browser only. They are not real academy records.</div>
  <main id="app"></main>
</div>
<div class="md" id="md"><div class="mc" id="mc"></div></div>
<div id="ts"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<script>
'use strict';
/* EduPro Academy Management – FRONTEND DEMO. Sample data only, stored in localStorage (key below). */
const K='eduProDemo_v1',$=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const td=()=>iso(new Date()),pk=n=>'Rs. '+Math.round(n||0).toLocaleString('en-PK'),uid=()=>Math.random().toString(36).slice(2,9);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=(m,d)=>{const x=new Date();x.setDate(1);x.setMonth(x.getMonth()-m);x.setDate(d);return iso(x)};
const nx=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return iso(x)};
const ic=()=>{if(window.lucide)lucide.createIcons()};
const months=n=>{const a=[],d=new Date();for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);a.push([iso(x).slice(0,7),x.toLocaleString('en',{month:'short'})])}return a};
const sum=(a,k)=>a.reduce((x,y)=>x+(k?y[k]:y),0);
let DB,cur='dashboard',ARG,CH=[],F={q:'',c:'',s:''},FF={q:'',s:''},AD=td(),AB='',SM=td().slice(0,7),EC='',R={f:'',t:''};
const CATS=['Rent','Electricity','Salaries','Stationery','Maintenance','Internet','Other'],MTH=['Cash','Cheque','Bank Deposit','Easypaisa','JazzCash'];

/* ---------- demo data ---------- */
function seed(){
 const courses=[{id:'c1',name:'Web Development',dur:'6 Months',fee:45000},{id:'c2',name:'Graphic Design',dur:'3 Months',fee:25000},{id:'c3',name:'English Language',dur:'3 Months',fee:15000},{id:'c4',name:'Computer Science',dur:'12 Months',fee:60000}];
 const faculty=[{id:'f1',name:'Usman Tariq',phone:'0300-4412765',subject:'Web Development',salary:65000,join:ago(14,5)},{id:'f2',name:'Ayesha Siddiqui',phone:'0321-7788901',subject:'Graphic Design',salary:50000,join:ago(10,12)},{id:'f3',name:'Hassan Raza',phone:'0333-5120948',subject:'English Language',salary:40000,join:ago(8,3)},{id:'f4',name:'Dr. Imran Shah',phone:'0345-9087612',subject:'Computer Science',salary:75000,join:ago(20,1)}];
 const batches=[{id:'b1',name:'Web Dev – Morning',course:'c1',teacher:'f1',time:'09:00 – 11:00'},{id:'b2',name:'Graphic Design – Evening',course:'c2',teacher:'f2',time:'05:00 – 07:00'},{id:'b3',name:'English – Weekend',course:'c3',teacher:'f3',time:'Sat/Sun 10:00 – 12:00'},{id:'b4',name:'CS – Morning',course:'c4',teacher:'f4',time:'11:00 – 01:00'}];
 const N=[['Muhammad Ali Hassan','Hassan Raza','Male'],['Fatima Zahra','Abdul Rehman','Female'],['Ahmed Raza','Raza Khan','Male'],['Hira Malik','Malik Aslam','Female'],['Bilal Ahmad','Ahmad Nawaz','Male'],['Zainab Noor','Noor Muhammad','Female'],['Usman Ghani','Ghani Khan','Male'],['Sana Iqbal','Iqbal Hussain','Female'],['Hamza Sheikh','Sheikh Rashid','Male'],['Maryam Aslam','Aslam Pervez','Female'],['Talha Mehmood','Mehmood Akhtar','Male'],['Areeba Khan','Khalid Mehmood','Female']];
 const A=['Gulberg III, Lahore','Model Town, Lahore','Johar Town, Lahore','DHA Phase 5, Lahore','Bahria Town, Rawalpindi','Satellite Town, Gujranwala'];
 const students=[],pay=[];
 N.forEach((n,i)=>{const c=courses[i%4],disc=i%3==0?2000:0,adm=ago(i%6,5+i%20),fn=c.fee-disc;
  students.push({id:'ACD-'+String(i+1).padStart(3,'0'),name:n[0],father:n[1],gender:n[2],phone:'030'+(i%5)+'-'+(1234567+i*91113),dob:ago(12*(18+i%5)+i,10),addr:A[i%6],adm,course:c.id,batch:batches[i%4].id,fee:c.fee,disc,status:i==10?'Inactive':i==11?'Completed':'Active',due:nx(adm,30),photo:''});
  pay.push({id:uid(),rc:'RC-'+(1001+pay.length),sid:'ACD-'+String(i+1).padStart(3,'0'),amt:Math.min(fn,Math.round(fn*[.5,1,.3,.7][i%4]/500)*500),date:nx(adm,3),method:['Cash','Cash','Cheque','Cash'][i%4]});});
 pay.push({id:uid(),rc:'RC-'+(1001+pay.length),sid:'ACD-003',amt:3000,date:td(),method:'Cash'});
 const exp=[];for(let m=0;m<6;m++){exp.push({id:uid(),date:ago(m,2),cat:'Rent',desc:'Monthly building rent',amt:55000},{id:uid(),date:ago(m,10),cat:'Electricity',desc:'WAPDA electricity bill',amt:16000+m*1800})}
 exp.push({id:uid(),date:ago(0,1),cat:'Stationery',desc:'Registers, markers and printing paper',amt:7500},{id:uid(),date:ago(1,15),cat:'Maintenance',desc:'AC servicing',amt:12000},{id:uid(),date:ago(2,9),cat:'Internet',desc:'Fibre internet monthly',amt:6000});
 const pm=ago(1,28),sal=faculty.map((f,i)=>({id:uid(),fid:f.id,month:pm.slice(0,7),base:f.salary,adv:i==1?5000:0,ded:0,net:f.salary-(i==1?5000:0),date:pm}));
 const sAtt={},fAtt={};
 for(let d=0;d<5;d++){const k=nx(td(),-d);sAtt[k]={};fAtt[k]={};students.filter(s=>s.status=='Active').forEach((s,i)=>sAtt[k][s.id]=(i+d*3)%11==0?'Absent':(i+d)%7==0?'Late':(i+d)%9==4?'Leave':'Present');faculty.forEach((f,i)=>fAtt[k][f.id]=(i+d)%6==5?'Leave':'Present')}
 return{courses,faculty,batches,students,pay,exp,sal,sAtt,fAtt,sn:N.length+1,rcn:1001+pay.length,set:{name:'Al-Noor Academy',phone:'042-35761234',email:'info@alnooracademy.pk',addr:'Gulberg III, Lahore',cur:'PKR',logo:''}}}
function save(){try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){toast('Storage full – could not save','er')}}
function load(){try{DB=JSON.parse(localStorage.getItem(K))}catch(e){DB=null}if(!DB||!DB.students){DB=seed();save()}}

/* ---------- helpers ---------- */
const S=id=>DB.students.find(s=>s.id==id),C=id=>DB.courses.find(c=>c.id==id),Fc=id=>DB.faculty.find(f=>f.id==id),B=id=>DB.batches.find(b=>b.id==id),cn=id=>(C(id)||{}).name||'—';
const fin=s=>s.fee-s.disc,paid=id=>sum(DB.pay.filter(p=>p.sid==id),'amt'),due=s=>fin(s)-paid(s.id);
const exps=()=>DB.exp.map(e=>({date:e.date,cat:e.cat,desc:e.desc,amt:e.amt})).concat(DB.sal.map(s=>({date:s.date,cat:'Salaries',desc:'Salary – '+((Fc(s.fid)||{}).name||'')+' ('+s.month+')',amt:s.net})));
const ini=n=>n.split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase();
const av=(s,z)=>s.photo?`<img class="avs ${z||''}" src="${s.photo}" alt="">`:`<span class="avs ${z||''}">${ini(s.name)}</span>`;
const bd=t=>{const m={Active:'ok',Paid:'ok',Present:'ok',Completed:'in',Pending:'wn',Late:'wn',Partial:'wn',Inactive:'er',Absent:'er',Unpaid:'er',Leave:'in',Income:'ok',Expense:'er'};return `<span class="bg ${m[t]||'in'}">${t}</span>`};
const fst=s=>due(s)<=0?'Paid':paid(s.id)>0?'Partial':'Unpaid';
const ab=(i,f,t,c)=>`<button class="ib sm ${c||''}" title="${t}" onclick="${f}"><i data-lucide="${i}"></i></button>`;
const sc=(i,l,v,c)=>`<div class="sc"><div class="si ${c||''}"><i data-lucide="${i}"></i></div><div><small>${l}</small><b>${v}</b></div></div>`;
const tbl=(cols,rows,act)=>`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}${act?'<th class="ac">Actions</th>':''}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.c.map(x=>`<td>${x}</td>`).join('')}${act?`<td class="ac">${r.a}</td>`:''}</tr>`).join(''):'<tr><td colspan="99" class="em">No records found</td></tr>'}</tbody></table></div>`;
function toast(m,t){const e=document.createElement('div');e.className='t '+(t||'');e.textContent=m;$('#ts').append(e);setTimeout(()=>e.remove(),3200)}
const openM=h=>{$('#mc').innerHTML=h;$('#md').classList.add('on');ic()},closeM=()=>$('#md').classList.remove('on');
function ask(msg,fn){openM(`<h3>Please confirm</h3><p>${msg}</p><div class="fa"><button class="btn g" onclick="closeM()">Cancel</button><button class="btn dn" id="yes">Yes, continue</button></div>`);$('#yes').onclick=()=>{closeM();fn()}}
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
function fld(f,v){const val=E(v[f.k]),w=f.w?'w2':'';let i;
 if(f.t=='select')i=`<select name="${f.k}">${f.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return `<option value="${E(a)}" ${v[f.k]==a?'selected':''}>${E(b)}</option>`}).join('')}</select>`;
 else if(f.t=='file')i=`<input type="file" name="${f.k}" accept="image/*">`;
 else i=`<input name="${f.k}" type="${f.t||'text'}" value="${val}" ${f.ro?'readonly':''} ${f.n?'':'required'} ${f.t=='number'?'min="0" step="any"':''}>`;
 return `<label class="${w}">${f.l}${i}</label>`}
function bindF(form,fields,old,cb){form.onsubmit=async e=>{e.preventDefault();const o={};for(const[k,v]of new FormData(form).entries())o[k]=v instanceof File?(v.size?await rd(v):old[k]||''):v;fields.forEach(f=>{if(f.t=='number')o[f.k]=+o[f.k]});cb(o)}}
function fm(title,fields,old,cb,after){openM(`<h3>${title}</h3><form id="fm" class="fg">${fields.map(f=>fld(f,old)).join('')}<div class="fa w2"><button type="button" class="btn g" onclick="closeM()">Cancel</button><button class="btn">Save</button></div></form>`);bindF($('#fm'),fields,old,cb);if(after)after($('#fm'))}
function sv(arr,id,o,msg){if(id)Object.assign(arr.find(x=>x.id==id),o);else arr.push(Object.assign({id:uid()},o));save();closeM();toast(msg);go(cur,ARG)}
const BL={courses:id=>DB.students.some(s=>s.course==id)||DB.batches.some(b=>b.course==id)?'Cannot delete: course has students or batches':'',batches:id=>DB.students.some(s=>s.batch==id)?'Cannot delete: batch has students':'',faculty:id=>DB.batches.some(b=>b.teacher==id)?'Cannot delete: faculty is assigned to a batch':''};
function del(key,id){const r=DB[key].find(x=>x.id==id),b=BL[key]&&BL[key](id);if(b)return toast(b,'er');
 ask(`Are you sure you want to delete <b>${E(r.name||r.rc||r.desc||'this record')}</b>? This cannot be undone.`,()=>{DB[key]=DB[key].filter(x=>x.id!=id);if(key=='students')DB.pay=DB.pay.filter(p=>p.sid!=id);save();toast('Record deleted');go(cur=='profile'?'students':cur,ARG)})}
function mk(id,type,labels,sets,opt){if(!window.Chart)return;CH.push(new Chart($(id),{type,data:{labels,datasets:sets},options:Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}},opt||{})}))}
const PAL=['#1e3a8a','#2563eb','#60a5fa','#bfdbfe'];

/* ---------- dashboard ---------- */

 <div class="tb"><label>Salary month <input type="month" value="${SM}" onchange="SM=this.value||SM;go('salary')"></label></div>
 <div class="card"><h3 class="ct">Salary Sheet – ${SM}</h3>${tbl(['Faculty','Basic','Advance','Deductions','Net','Status'],DB.faculty.map(f=>{const r=rs.find(s=>s.fid==f.id);return{c:[`<b>${E(f.name)}</b>`,pk(f.salary),r?pk(r.adv):'—',r?pk(r.ded):'—',r?pk(r.net):'—',bd(r?'Paid':'Pending')],a:r?'':`<button class="btn" onclick="salM('${f.id}')">Pay Salary</button>`}}),1)}</div>
 <div class="card"><h3 class="ct">Payment History</h3>${tbl(['Date','Faculty','Month','Basic','Advance','Deductions','Net Paid'],hist.map(s=>({c:[s.date,E((Fc(s.fid)||{}).name),s.month,pk(s.base),pk(s.adv),pk(s.ded),`<b>${pk(s.net)}</b>`],a:ab('trash-2',`del('sal','${s.id}')`,'Delete','dn')})),1)}</div>`}

/* ---------- reports ---------- */
function rep(){const f=R.f=R.f||ago(5,1),t=R.t=R.t||td();return{f,t,pays:DB.pay.filter(p=>p.date>=f&&p.date<=t),ex:exps().filter(e=>e.date>=f&&e.date<=t),adm:DB.students.filter(s=>s.adm>=f&&s.adm<=t)}}
function repP(){const r=rep(),inc=sum(r.pays,'amt'),exv=sum(r.ex,'amt'),bc={};r.ex.forEach(e=>bc[e.cat]=(bc[e.cat]||0)+e.amt);
 return `<div class="tb"><label>From <input type="date" id="rf" value="${r.f}"></label><label>To <input type="date" id="rt" value="${r.t}"></label><button class="btn g" onclick="R.f=$('#rf').value;R.t=$('#rt').value;go('reports')">Apply Filter</button><button class="btn" onclick="prn()"><i data-lucide="printer"></i>Print Report</button></div>
 <p><b>${E(DB.set.name)}</b> – Report period: ${r.f} to ${r.t}</p>
 <div class="cards">${sc('trending-up','Income',pk(inc),'g')}${sc('receipt','Expenses',pk(exv),'r')}${sc('scale','Net Result',pk(inc-exv))}${sc('user-plus','New Admissions',r.adm.length)}</div>
 <div class="g2"><div class="card"><h3 class="ct">Income vs Expenses</h3><div class="cv"><canvas id="c1"></canvas></div></div><div class="card"><h3 class="ct">Income by Course</h3><div class="cv"><canvas id="c2"></canvas></div></div></div>
 <div class="g2"><div class="card"><h3 class="ct">Expenses by Category</h3>${tbl(['Category','Total'],Object.keys(bc).map(k=>({c:[k,pk(bc[k])]})).concat([{c:['<b>Total</b>',`<b>${pk(exv)}</b>`]}]))}</div>
 <div class="card"><h3 class="ct">Fee Collection</h3>${tbl(['Receipt','Date','Student','Amount'],r.pays.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15).map(p=>({c:[p.rc,p.date,E((S(p.sid)||{}).name),pk(p.amt)]})))}</div></div>`}
function repPost(){const r=rep(),M=[];let d=new Date(r.f.slice(0,7)+'-01T00:00:00');for(let i=0;i<24;i++){const k=iso(d).slice(0,7);M.push([k,d.toLocaleString('en',{month:'short',year:'2-digit'})]);if(k>=r.t.slice(0,7))break;d.setMonth(d.getMonth()+1)}
 mk('#c1','bar',M.map(m=>m[1]),[{label:'Income',data:M.map(m=>sum(r.pays.filter(p=>p.date.startsWith(m[0])),'amt')),backgroundColor:'#2563eb',borderRadius:5},{label:'Expenses',data:M.map(m=>sum(r.ex.filter(e=>e.date.startsWith(m[0])),'amt')),backgroundColor:'#93c5fd',borderRadius:5}]);
 mk('#c2','doughnut',DB.courses.map(c=>c.name),[{data:DB.courses.map(c=>sum(r.pays.filter(p=>(S(p.sid)||{}).course==c.id),'amt')),backgroundColor:PAL}])}

/* ---------- settings ---------- */
const setF=[{k:'name',l:'Academy Name'},{k:'phone',l:'Phone'},{k:'email',l:'Email',t:'email'},{k:'cur',l:'Currency',ro:1},{k:'addr',l:'Address',w:1},{k:'logo',l:'Academy Logo',t:'file'}];
const setP=()=>`<div class="card"><h3 class="ct">Academy Settings</h3><form id="sf" class="fg">${setF.map(f=>fld(f,DB.set)).join('')}<div class="fa w2"><button class="btn"><i data-lucide="save"></i>Save Settings</button></div></form></div>
 <div class="card"><h3 class="ct">Demo Data</h3><p>This demo stores sample records in this browser only. Resetting restores the original sample data.</p><button class="btn dn" onclick="ask('Reset all demo data to the original sample records?',()=>{localStorage.removeItem(K);load();brand();toast('Demo data reset');go('dashboard')})">Reset Demo Data</button></div>`;
const setPost=()=>bindF($('#sf'),setF,DB.set,o=>{Object.assign(DB.set,o);save();brand();toast('Settings saved')});
function brand(){$('#bn').textContent=DB.set.name;$('#bl').innerHTML=DB.set.logo?`<img src="${DB.set.logo}" alt="">`:'<i data-lucide="graduation-cap"></i>';ic()}

/* ---------- router & boot ---------- */
const NAV=[['dashboard','Dashboard','layout-dashboard'],['admission','Student Admissions','user-plus'],['students','Students Management','users'],['faculty','Faculty Management','briefcase'],['courses','Courses','book-open'],['batches','Batches','layers'],['sAtt','Student Attendance','calendar-check'],['fAtt','Faculty Attendance','user-check'],['fees','Fee Management','wallet'],['cash','Cash Payments','banknote'],['exp','Expenses','receipt'],['acc','Accounting','calculator'],['salary','Salary Management','coins'],['reports','Reports & Analytics','bar-chart-3'],['settings','Settings','settings']];
const PG={dashboard:[dash,dashPost],admission:[admission,admPost],students:[stP],profile:[profile],faculty:[facP],courses:[crsP],batches:[batP],sAtt:[()=>attP('s')],fAtt:[()=>attP('f')],fees:[feeP],cash:[cashP,cashPost],exp:[expP],acc:[accP,accPost],salary:[salP],reports:[repP,repPost],settings:[setP,setPost]};
function go(p,a){const same=cur==p,y=window.scrollY;cur=p;ARG=a;CH.forEach(c=>c.destroy());CH=[];const n=NAV.find(x=>x[0]==p);
 $('#pt').textContent=n?n[1]:'Student Profile';document.querySelectorAll('#nav a').forEach(e=>e.classList.toggle('on',e.dataset.p==(p=='profile'?'students':p)));
 if(window.Chart)Chart.defaults.color=getComputedStyle(document.body).getPropertyValue('--mu').trim()||'#64708a';
 $('#app').innerHTML=PG[p][0](a);if(PG[p][1])PG[p][1](a);ic();document.body.classList.remove('so');window.scrollTo(0,same?y:0)}
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('eduTheme',t)}catch(e){}$('#th').innerHTML=`<i data-lucide="${t=='dark'?'sun':'moon'}"></i>`;ic();if(DB)go(cur,ARG)}
$('#th').onclick=()=>theme(document.documentElement.dataset.theme=='dark'?'light':'dark');
$('#md').onclick=e=>{if(e.target.id=='md')closeM()};
$('#nav').innerHTML=NAV.map(n=>`<a href="#" data-p="${n[0]}" onclick="go('${n[0]}');return false"><i data-lucide="${n[2]}"></i><span>${n[1]}</span></a>`).join('');
load();brand();let th='light';try{th=localStorage.getItem('eduTheme')||'light'}catch(e){}theme(th);

</script>
